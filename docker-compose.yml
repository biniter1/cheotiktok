# Chạy cả cụm trên 1 máy: 3 API + 2 worker sau nginx.
#   cp .env.example .env && docker compose up -d --build
#   scale nóng: docker compose up -d --scale api=5 --scale worker=3
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: cheo
    volumes: [pgdata:/var/lib/postgresql/data]
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d cheo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: .
    env_file: .env
    deploy:
      replicas: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/readyz"]
      interval: 10s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 15s

  worker:
    build: .
    env_file: .env
    command: ["node", "dist/worker.js"]
    deploy:
      replicas: 2
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 60s

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
