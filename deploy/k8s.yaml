# Production trên Kubernetes (EKS / GKE / k3s).
# Postgres + Redis nên dùng dịch vụ managed có failover: RDS Multi-AZ, ElastiCache (replica + auto-failover).
# Secret thật nên quản lý bằng External Secrets / Sealed Secrets, không commit.
apiVersion: v1
kind: Namespace
metadata: { name: cheo }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: cheo-config, namespace: cheo }
data:
  FRONTEND_URL: "https://cheo.example.com"
  TIKTOK_REDIRECT_URI: "https://api.cheo.example.com/auth/tiktok/callback"
  LOG_LEVEL: "info"
  PG_POOL_MAX: "10"
  POLL_INTERVAL_MIN: "15"
  POLL_MAX_PER_MIN: "300"
  SHUTDOWN_DRAIN_MS: "10000"
---
apiVersion: v1
kind: Secret
metadata: { name: cheo-secrets, namespace: cheo }
type: Opaque
stringData:
  DATABASE_URL: "postgres://app:CHANGE@rds-endpoint:5432/cheo?sslmode=require"
  REDIS_URL: "rediss://CHANGE@elasticache-endpoint:6379"
  JWT_SECRET: "CHANGE"
  TOKEN_ENC_KEY: "CHANGE"
  TIKTOK_CLIENT_KEY: "CHANGE"
  TIKTOK_CLIENT_SECRET: "CHANGE"
---
# Migration chạy 1 lần mỗi lần deploy (advisory lock nên chạy trùng cũng an toàn)
apiVersion: batch/v1
kind: Job
metadata: { name: cheo-migrate, namespace: cheo }
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/you/tiktok-cheo:latest
          command: ["node", "dist/migrate.js"]
          envFrom: [{ configMapRef: { name: cheo-config } }, { secretRef: { name: cheo-secrets } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cheo-api, namespace: cheo }
spec:
  replicas: 3
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # deploy không giảm năng lực phục vụ
  selector: { matchLabels: { app: cheo-api } }
  template:
    metadata: { labels: { app: cheo-api } }
    spec:
      terminationGracePeriodSeconds: 30
      # rải pod qua nhiều AZ và nhiều node: mất 1 AZ / 1 node vẫn còn pod sống
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: cheo-api } }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: cheo-api } }
      containers:
        - name: api
          image: ghcr.io/you/tiktok-cheo:latest
          ports: [{ containerPort: 3000 }]
          envFrom: [{ configMapRef: { name: cheo-config } }, { secretRef: { name: cheo-secrets } }]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata: { name: cheo-api, namespace: cheo }
spec:
  selector: { app: cheo-api }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cheo-api
  namespace: cheo
  annotations:
    # ingress-nginx: giữ websocket lâu; KHÔNG cần sticky session vì chỉ dùng transport websocket
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: api.cheo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: cheo-api, port: { number: 80 } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: cheo-api, namespace: cheo }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: cheo-api }
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # tránh scale xuống vội làm ngắt websocket hàng loạt
      policies: [{ type: Pods, value: 2, periodSeconds: 60 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: cheo-api, namespace: cheo }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: cheo-api } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cheo-worker, namespace: cheo }
spec:
  replicas: 2
  selector: { matchLabels: { app: cheo-worker } }
  template:
    metadata: { labels: { app: cheo-worker } }
    spec:
      terminationGracePeriodSeconds: 90   # cho job đang chạy hoàn tất
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: cheo-worker } }
      containers:
        - name: worker
          image: ghcr.io/you/tiktok-cheo:latest
          command: ["node", "dist/worker.js"]
          envFrom: [{ configMapRef: { name: cheo-config } }, { secretRef: { name: cheo-secrets } }]
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: cheo-worker, namespace: cheo }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: cheo-worker }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: cheo-worker, namespace: cheo }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: cheo-worker } }
